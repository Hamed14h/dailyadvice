<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quote of the Day ❤️</title>

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="quote-box">
      <!-- Title -->
      <h2>Quote of the Day</h2>

      <!-- Quote will come from JavaScript/API -->
      <blockquote class="quote">Loading...</blockquote>

      <!-- Author will come from API -->
      <span class="author"> Loading... </span>

      <!-- Buttons -->
      <div class="buttons">
        <!-- New quote button -->
        <button id="quoteBtn">
          <i class="fa-solid fa-heart"></i>
          New Quote
        </button>

        <!-- Instagram button -->
        <!-- Change YOUR_USERNAME to your Instagram username -->
        <a
          href="https://www.instagram.com/20cent.ahmed/"
          target="_blank"
          class="instagram-btn"
        >
          <i class="fa-brands fa-instagram"></i>
          Instagram
        </a>
      </div>
      <audio id="bgMusic" loop>
        <source
          src="ytmp3free.cc_i-wanna-be-yours-by-arctic-monkeys-iwannabeyours-arcticmonkeys-lyrics-lyricvideo-live-trending-youtubemp3free.org.mp3"
          type="audio/mpeg"
        />
      </audio>

      <button id="musicBtn">
        <i class="fa-solid fa-music"></i>
        Play Music
      </button>
    </div>

    <!-- JavaScript -->
    <script src="index.js"></script>
  </body>
</html>
